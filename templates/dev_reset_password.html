{% extends "base.html" %}

{% block title %}Dev Reset Password{% endblock %}

{% block content %}
<section class="panel auth-panel danger-panel">
    <p class="eyebrow">Development Only</p>
    <h1>Reset Password</h1>
    <p class="muted">Use this local-only tool to recover an account. Disable dev tools before any public test.</p>
    <form method="post" class="wide-form" autocomplete="off">
        <label for="username">Username</label>
        <input id="username" name="username" required autocomplete="off" spellcheck="false">

        <label for="new_password">New Password</label>
        <input id="new_password" name="new_password" type="password" required autocomplete="new-password">

        <button type="submit">Reset Password</button>
    </form>
    <p><a href="{{ url_for('login') }}">Back to login</a></p>
</section>
{% endblock %}
